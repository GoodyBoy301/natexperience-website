<header
  class="nat-custom-header"
  data-storefront-ref="01a1cf12-cd3f-72b5-b752-ea33209a16b8"
>
  <a class="nat-custom-header__brand" href="/" aria-label="Zodiac Party home"
    ><img
      src="https://natexperience-assets.goodyboy-work.workers.dev/zodiac-party-logo.png"
      alt="Zodiac Party"
      width="140"
      height="43"
  /></a>
  <a class="nat-custom-header__tickets" href="#next-event" target="_top">
    <span>Buy Tickets</span>
  </a>
</header>
<footer class="nat-custom-footer" aria-label="Explore events">
  <div class="nat-custom-footer__feature" aria-live="polite">
    <img class="nat-custom-footer__artwork" data-footer-image alt="" />
    <div
      class="nat-custom-footer__artwork nat-custom-footer__placeholder"
      data-footer-placeholder
      aria-hidden="true"
      hidden
    >
      <span>Coming soon</span>
    </div>
    <time data-footer-date></time>
    <h2 data-footer-title>Find your next night out</h2>
    <a class="nat-custom-footer__cta" data-footer-cta href="#events" hidden
      >Get tickets</a
    >
    <div class="nat-custom-footer__notify" data-footer-notify hidden>
      <input
        type="email"
        autocomplete="email"
        aria-label="Email address"
        placeholder="Email address"
        disabled
      />
      <button type="button" disabled>Notify me</button>
    </div>
  </div>
  <div
    class="nat-custom-footer__timeline"
    data-footer-events
    role="group"
    aria-label="Choose an event"
  ></div>
  <p class="nat-custom-footer__empty" data-footer-empty>
    Upcoming events will appear here.
  </p>
</footer>
<script>
  (() => {
    const footer = document.querySelector(".nat-custom-footer");
    if (!footer) return;
    const timeline = footer.querySelector("[data-footer-events]");
    const empty = footer.querySelector("[data-footer-empty]");
    const dockMotion = window.matchMedia(
      "(any-hover: hover) and (any-pointer: fine) and (prefers-reduced-motion: no-preference)",
    );
    let dockFrame = 0;
    let lastFrame = 0;
    let pointer = null;
    let growth = [];
    let offset = 0;
    const resetDock = () => {
      cancelAnimationFrame(dockFrame);
      dockFrame = 0;
      lastFrame = 0;
      pointer = null;
      growth = [];
      offset = 0;
      for (const tile of timeline.children)
        tile.style.removeProperty("transform");
    };
    const updateDock = (now) => {
      const rail = timeline.getBoundingClientRect();
      const tiles = Array.from(timeline.children, (tile) => ({
        tile,
        left: tile.offsetLeft,
        width: tile.offsetWidth,
      }));
      const first = tiles[0];
      const last = tiles.at(-1);
      const x = pointer ? pointer.x - rail.left : 0;
      const targets = tiles.map(({ left, width }) => {
        if (!pointer) return 0;
        const distance = Math.abs(x - left - width / 2) / (width * 2.5);
        return distance < 1
          ? (width * 0.625 * (1 + Math.cos(Math.PI * distance))) / 2
          : 0;
      });
      const before = targets.reduce((total, size, index) => {
        const { left, width } = tiles[index];
        return total + size * Math.min(1, Math.max(0, (x - left) / width));
      }, 0);
      const after = targets.reduce((total, size) => total + size, 0) - before;
      const limit = Math.max(
        0,
        Math.min(
          1,
          before > 0 ? first.left / before : 1,
          after > 0 ? (rail.width - last.left - last.width) / after : 1,
        ),
      );
      const blend = 1 - Math.exp(-(lastFrame ? now - lastFrame : 16) / 45);
      lastFrame = now;
      const approach = (current, target) =>
        Math.abs(target - current) < 0.05
          ? target
          : current + (target - current) * blend;
      const targetOffset = -before * limit;
      offset = approach(offset, targetOffset);
      let moving = offset !== targetOffset;
      let shift = offset;
      tiles.forEach(({ tile, width }, index) => {
        const target = targets[index] * limit;
        const extra = approach(growth[index] ?? 0, target);
        growth[index] = extra;
        moving ||= extra !== target;
        tile.style.transform =
          shift || extra
            ? `translateX(${shift + extra / 2}px) scale(${1 + extra / width})`
            : "";
        shift += extra;
      });
      dockFrame = moving ? requestAnimationFrame(updateDock) : 0;
      if (!moving) lastFrame = 0;
    };
    const scheduleDock = () => {
      if (!dockFrame) dockFrame = requestAnimationFrame(updateDock);
    };
    const leaveDock = () => {
      if (!pointer) return;
      pointer = null;
      scheduleDock();
    };
    timeline.addEventListener("pointermove", (event) => {
      if (!dockMotion.matches || event.pointerType === "touch") return;
      const tile = timeline.firstElementChild;
      if (!tile) return;
      const y = event.clientY - timeline.getBoundingClientRect().top;
      const top = tile.offsetTop - (pointer ? tile.offsetHeight * 0.625 : 0);
      if (y < top || y > tile.offsetTop + tile.offsetHeight) return leaveDock();
      pointer = { x: event.clientX };
      scheduleDock();
    });
    timeline.addEventListener("pointerleave", leaveDock);
    timeline.addEventListener("pointercancel", resetDock);
    timeline.addEventListener("scroll", resetDock, { passive: true });
    dockMotion.addEventListener("change", resetDock);
    const title = footer.querySelector("[data-footer-title]");
    const artwork = footer.querySelector("[data-footer-image]");
    const placeholder = footer.querySelector("[data-footer-placeholder]");

    const assetRoot = "https://natexperience-assets.goodyboy-work.workers.dev/";
    const images = [
      "zodiac-party-hero-poster.jpg",
      "all-white-parties.jpg",
      "after-work-parties.jpg",
      "pool-parties.jpg",
    ];
    let events = [];
    let selectedIndex = 0;
    const date = footer.querySelector("[data-footer-date]");
    const cta = footer.querySelector("[data-footer-cta]");
    const notify = footer.querySelector("[data-footer-notify]");
    const pastEvents = [
      ["After-work 9–5", "2026-10-18"],
      ["All White Party", "2026-09-06"],
    ].map(([title, startAt], index) => ({
      title,
      startAt: `${startAt}T19:00:00+01:00`,
      period: "past",
      cover: images[(index + 1) % images.length],
      href: "https://www.youtube.com/channel/UCJqL2utf4_qrIGi4zscI88w/videos",
      ctaLabel: "Watch past editions",
      target: "_blank",
    }));
    const unannouncedEvents = Array.from({ length: 8 }, () => ({
      title: "Coming soon",
      period: "unannounced",
    }));
    const formatDate = (value, options) =>
      new Intl.DateTimeFormat("en-NG", {
        ...options,
        timeZone: "Africa/Lagos",
      }).format(new Date(value));
    const showEvent = (event) => {
      title.textContent = event.title;
      title.hidden = event.period === "unannounced";
      selectedIndex = event.index;
      notify.hidden = event.period !== "unannounced";
      placeholder.hidden = Boolean(event.cover);
      if (event.cover) {
        artwork.src = assetRoot + event.cover;
        artwork.hidden = false;
      } else {
        artwork.removeAttribute("src");
        artwork.hidden = true;
      }
      if (event.startAt) {
        date.dateTime = event.startAt;
        date.textContent = formatDate(event.startAt, {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      } else {
        date.removeAttribute("datetime");
        date.textContent = "";
      }
      if (event.href) {
        cta.href = event.href;
        cta.textContent = event.ctaLabel;
        if (event.target) cta.target = event.target;
        else cta.removeAttribute("target");
        cta.rel = event.target === "_blank" ? "noopener noreferrer" : "";
        cta.hidden = false;
      } else {
        cta.removeAttribute("href");
        cta.hidden = true;
      }
      timeline.querySelectorAll("[data-event-index]").forEach((button) => {
        button.setAttribute(
          "aria-pressed",
          String(Number(button.dataset.eventIndex) === event.index),
        );
      });
    };
    const renderEvents = (upcomingEvents = []) => {
      const upcoming = upcomingEvents.slice(0, 2).map((event, index) => ({
        title: event.title,
        startAt: event.startAt,
        period: "upcoming",
        cover: images[index],
        href: `/events/${encodeURIComponent(event.slug)}`,
        ctaLabel: "Get tickets",
      }));
      const sampleUpcoming = [
        ["Project Sagittarius · Night One", "2026-12-05T20:00:00+01:00"],
        ["Project Sagittarius · Night Two", "2026-12-30T20:00:00+01:00"],
      ];
      while (upcoming.length < 2) {
        const [title, startAt] = sampleUpcoming[upcoming.length];
        upcoming.push({
          title,
          startAt,
          period: "upcoming",
          cover: images[upcoming.length],
          href: "#next-event",
          ctaLabel: "Get tickets",
        });
      }
      events = [...pastEvents, ...upcoming, ...unannouncedEvents].map(
        (event, index) => ({
          ...event,
          index,
        }),
      );
      resetDock();
      timeline.replaceChildren();
      empty.hidden = true;
      events.forEach((event) => {
        const button = document.createElement("button");
        button.className = "nat-custom-footer__event";
        button.type = "button";
        button.dataset.eventIndex = String(event.index);
        button.dataset.eventPeriod = event.period;
        button.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-label", event.title);
        if (event.cover) {
          const image = document.createElement("img");
          image.src = assetRoot + event.cover;
          image.alt = "";
          image.loading = "lazy";
          button.append(image);
        } else {
          const emptyCover = document.createElement("span");
          emptyCover.className = "nat-custom-footer__empty-cover";
          emptyCover.textContent = "Soon";
          emptyCover.setAttribute("aria-hidden", "true");
          button.append(emptyCover);
        }
        button.addEventListener("click", () => showEvent(event));
        timeline.append(button);
      });
      showEvent(events.find((event) => event.period === "upcoming"));
    };

    renderEvents();
    window.addEventListener("message", (message) => {
      const fromFrame = [...document.querySelectorAll("iframe")].some(
        (frame) => frame.contentWindow === message.source,
      );
      if (!fromFrame || message.data?.type !== "nat:event-data") return;
      const events = Array.isArray(message.data.events)
        ? message.data.events.filter(
            (event) =>
              event &&
              typeof event.slug === "string" &&
              typeof event.title === "string" &&
              Number.isFinite(Date.parse(event.startAt)) &&
              Date.parse(event.startAt) > Date.now(),
          )
        : [];
      renderEvents(events);
    });
  })();
</script>
<dialog
  class="nat-event-drawer"
  id="nat-event-drawer"
  aria-labelledby="nat-event-drawer-title"
>
  <div class="nat-event-drawer__panel">
    <header class="nat-event-drawer__header">
      <h2 id="nat-event-drawer-title">Event details</h2>
      <button
        type="button"
        data-event-drawer-close
        aria-label="Close event details"
      >
        Close
      </button>
    </header>
    <p class="nat-event-drawer__loading" role="status">Loading event…</p>
    <iframe
      title="Event details"
      src="about:blank"
      allow="payment"
      loading="eager"
    ></iframe>
  </div>
</dialog>
<script src="https://natexperience-assets.goodyboy-work.workers.dev/site-menu-close.js?v=20261114-iframe-no-header"></script>
<script
  src="https://natexperience-assets.goodyboy-work.workers.dev/devtools.js"
